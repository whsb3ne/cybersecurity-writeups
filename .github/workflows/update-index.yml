name: Update Writeup Index

on:
  push:
    branches:
      - main
    paths:
      - 'tryhackme/**/README.md'
      - 'hackthebox/**/README.md'
      - 'ctf-events/**/README.md'
      - 'generate_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate writeup index table
        run: python3 generate_index.py

      - name: Commit and push updated README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: auto-update writeup index table [skip ci]"
            git push
          fi
